[project]
name = "pickone"
version = "0.1.0"
description = "PickOne — choose between anything"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
]

[project.scripts]
pickone-worker = "pickone.worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pickone"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "T20", "RUF", "ASYNC"]
ignore = ["RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"src/pickone/db/migrations/versions/*" = ["E501", "I001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = []
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

# The two modules where a bug is silent and permanent  [SPEC §16.7]
[[tool.mypy.overrides]]
module = ["pickone.rating.*", "pickone.battles.*"]
strict = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "apscheduler.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/pickone"]
branch = true

# ---------------------------------------------------------------- import-linter
# The boundaries from SPEC §17.3. They are load-bearing: rating/ must stay pure
# so it can be simulated, and matchmaking/ must never learn to compute a rating.
[tool.importlinter]
root_package = "pickone"
# required because the rating/ contract forbids external packages (sqlalchemy, fastapi)
include_external_packages = true

[[tool.importlinter.contracts]]
name = "rating/ is pure — no database, no framework"
type = "forbidden"
source_modules = ["pickone.rating"]
forbidden_modules = [
    "pickone.db", "pickone.battles", "pickone.matchmaking", "pickone.api",
    "sqlalchemy", "fastapi", "alembic", "asyncpg",
]

[[tool.importlinter.contracts]]
name = "matchmaking/ never imports rating/"
type = "forbidden"
source_modules = ["pickone.matchmaking"]
forbidden_modules = ["pickone.rating"]

[[tool.importlinter.contracts]]
name = "public/ is read-only — it may not import the write path"
type = "forbidden"
source_modules = ["pickone.public"]
forbidden_modules = ["pickone.battles", "pickone.moderation"]

[[tool.importlinter.contracts]]
name = "moderation/ never imports items/"
type = "forbidden"
source_modules = ["pickone.moderation"]
forbidden_modules = ["pickone.items"]
