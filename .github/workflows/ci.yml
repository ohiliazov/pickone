name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PICKONE_ENV: test

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pickone
          POSTGRES_PASSWORD: pickone
          POSTGRES_DB: pickone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pickone"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      # Given a database, the harness uses it instead of starting a container.
      PICKONE_TEST_DATABASE_URL: postgresql+asyncpg://pickone:pickone@localhost:5432/pickone_test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv python install 3.12
      - run: uv sync --all-groups --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src tests

      - name: Module boundaries
        # rating/ stays pure; matchmaking/ never learns to compute a rating.
        run: uv run lint-imports --config pyproject.toml

      - name: Migrations run from empty
        run: uv run alembic upgrade head
        env:
          PICKONE_DATABASE_URL: postgresql+asyncpg://pickone:pickone@localhost:5432/pickone_test

      - name: Schema matches the ORM
        # Fails when a model changes and its migration does not.
        run: uv run alembic check
        env:
          PICKONE_DATABASE_URL: postgresql+asyncpg://pickone:pickone@localhost:5432/pickone_test

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Non-production must not be indexable
        # [SPEC §14.8] An indexed preview deploy is the classic own-goal, so the
        # guard is a build-time assertion rather than a note in a runbook.
        run: |
          test -f .next/server/app/robots.txt.body
          grep -q "Disallow: /" .next/server/app/robots.txt.body
          echo "staging robots.txt correctly disallows everything"
