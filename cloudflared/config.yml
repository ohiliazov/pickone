# cloudflared/config.yml
# Copied to /etc/cloudflared/config.yml by scripts/setup-pi.sh.
# TUNNEL_ID and yourdomain.com are substituted during setup.

tunnel: TUNNEL_ID
credentials-file: /root/.cloudflared/TUNNEL_ID.json

ingress:
  # The API. /docs and /openapi.json are served only outside production
  # (see api/app.py), so they 404 here rather than leaking the schema.
  - hostname: yourdomain.com
    path: ^/api/
    service: http://localhost:8100

  # Container logs. Must stay above the frontend catch-all, and MUST be covered
  # by a Cloudflare Access policy — Dozzle has no authentication of its own.
  - hostname: yourdomain.com
    path: ^/logs(/|$)
    service: http://localhost:8180

  # Everything else is the Next.js app: /, /rankings, /item/*, /compare/*,
  # /play, /robots.txt, /sitemap.xml and the OG image routes.
  - hostname: yourdomain.com
    service: http://localhost:3100

  - service: http_status:404
